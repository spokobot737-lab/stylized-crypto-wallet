name: Build Windows installer
on:
  push:
    branches: [main, 'update/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a public prerelease with the installer'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: wallet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # One-time source bootstrap for the browser upload. The archive contains no
      # workflows, credentials, binaries, or dependencies and is removed in the same commit.
      - name: Apply source upload
        id: source
        if: hashFiles('wallet-source.zip') != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        run: |
          Expand-Archive -Path wallet-source.zip -DestinationPath . -Force
          Remove-Item wallet-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Materialize FRAME Wallet source and remove transport archive'
          git push origin "HEAD:${{ github.ref_name }}"
          "initial=true" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify derivation, vault and all three transaction signatures
        run: npm test
      - name: Typecheck and compile
        run: npm run build
      - name: Exercise real Electron runtime and renderer isolation
        run: node --import tsx scripts/smoke.mjs
      - name: Verify Frame Chat, media and responsive layout in Electron
        run: node scripts/ui-smoke-060.mjs
      - name: Verify FRAME Run controls and responsive canvas
        run: node scripts/ui-frame-run.mjs
      - name: Verify FRAME Run inside Frame Wallet
        run: node scripts/ui-frame-run-wallet.mjs
      - name: Verify all six offline games, computer chess and isolated profile HTML
        run: node scripts/ui-games-080.mjs && node scripts/ui-profile-080.mjs
      - name: Verify stable forms, social feed and real local NFT mint
        run: node scripts/ui-interactions-090.mjs && node scripts/ui-social-090.mjs && node scripts/ui-mint-090.mjs
      - name: Package Windows x64 NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path 'release/win-unpacked/FRAME Wallet.exe').Path
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if (-not $icon) { throw 'Missing executable icon' }
          $bitmap = $icon.ToBitmap()
          $purple = 0
          for ($y=0; $y -lt $bitmap.Height; $y++) {
            for ($x=0; $x -lt $bitmap.Width; $x++) {
              $pixel = $bitmap.GetPixel($x,$y)
              if ($pixel.R -gt 130 -and $pixel.R -lt 230 -and $pixel.B -gt ($pixel.R+20) -and $pixel.G -lt ($pixel.B-20)) { $purple++ }
            }
          }
          if ($purple -lt 5) { throw 'FRAME purple hexagon icon not found in executable' }
          $bitmap.Save((Join-Path (Get-Location) 'docs/windows-app-icon.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()
          $icon.Dispose()
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath release/SHA256SUMS.txt -Append -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FRAME-Wallet-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            docs/*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FRAME-UI-previews
          path: docs/*.png
          if-no-files-found: ignore
      - name: Publish release with installer
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INITIAL_UPLOAD: ${{ steps.source.outputs.initial }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:REF_TYPE -eq 'tag') { $tag = $env:TAG_REF }
          elseif ($env:INITIAL_UPLOAD -eq 'true') { $tag = "v${version}" }
          elseif (-not (git tag -l "v${version}")) { $tag = "v${version}" }
          else { $tag = "v${version}-build.${{ github.run_number }}" }
          $sha = git rev-parse HEAD
          # Preserve existing stable releases as browsable branches too.
          $stableTags = @(git tag -l 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
          foreach ($stableTag in $stableTags) {
            $pastBranch = "versions/$stableTag"
            $pastExists = git ls-remote --heads origin "refs/heads/$pastBranch"
            if (-not $pastExists) {
              $pastSha = git rev-parse "${stableTag}^{commit}"
              git push origin "${pastSha}:refs/heads/$pastBranch"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve past version branch' }
            }
          }
          $versionBranch = "versions/v${version}"
          $existing = git ls-remote --heads origin "refs/heads/$versionBranch"
          if (-not $existing) {
            git push origin "${sha}:refs/heads/$versionBranch"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve version branch' }
          }
          $notes = @"
          FRAME Wallet ${version}: Windows x64.
          Pobierz FRAME-Wallet-${version}-Setup-x64.exe z Assets. ZIP Source code zawiera źródła, bez EXE.
          Naprawiono utratę focusu i resetowanie interakcji w dialogach czatu/profilu; callback onClose nie uruchamia ponownie efektu focusu podczas odświeżeń. Szkice pozostają lokalne do jawnego zapisu/publikacji.
          Czat: salda aktywa/gazu, Max z rezerwą opłaty, filtrowanie NFT według aktualnej własności, bez duplikowania płatności przy ponawianiu karty.
          Społeczność: centralny feed z buforem nowych wpisów, wątki, strony profili, istniejące zweryfikowane prośby o kontakt, responsywne panele. Publiczne Nostr, nie E2EE; status wygasa po 120 s. HTML nadal w sandboxie.
          Szachy offline: komputer Easy/Medium/Hard, wybór koloru i worker js-chess-engine 2.4.6 (MIT). Zachowano grę lokalną i pozostałe gry.
          NFT: podgląd zgodny z CSP, etapy błędów, automatyczny wybór zapisu, potwierdzenie i metadane niezależne od galerii, czyszczenie cache po potwierdzeniu oraz odzyskiwanie tej samej podpisanej transakcji.
          Weryfikacja: 85 testów, typy, build, rzeczywisty Electron, interakcje pod odświeżeniami, szachy offline, izolacja HTML, pełny lokalny mint PNG/TXT i galeria. Szczegóły: docs/0.9.0-TESTING.md.
          Odczyty testnetów ETH/RH/SOL potwierdzono 2026-11-07. Brak potwierdzonego mintu na publicznych testnetach: brak środków testowych, faucet RPC Solana zamknięty (410), strona faucetu Robinhood 403; Sepolia miała też timeout. Nie wykonano transakcji mainnet. Test lokalny nie zastępuje testu sieci publicznej.
          Pliki do 8 KiB EVM mogą być zawarte w metadanych. Większe obsługiwane pliki do 5 MB wymagają własnego publicznego hostingu Pinata; Solana wymaga krótkiego URI. Bez płatnej usługi obowiązkowej i bez sekretów developera.
          Portfele, klucze, PIN, rozmowy, profile i preferencje zachowane. Instalator bez Authenticode; ręczna instalacja na prywatnym komputerze nie była sprawdzana. Publiczny serwer punktów FRAME nadal wymaga osobnej konfiguracji.
          "@
          $notes | Out-File -FilePath release/notes.md -Encoding utf8
          $assets = @(Get-ChildItem release/*.exe | ForEach-Object { $_.FullName })
          $assets += 'release/SHA256SUMS.txt'
          $assets += @(Get-ChildItem docs/*0.9.0.png | ForEach-Object { $_.FullName })
          gh release create $tag --target $sha --title "FRAME Wallet $tag" --notes-file release/notes.md --prerelease @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
