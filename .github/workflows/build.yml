name: Build Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a private prerelease with the installer'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: wallet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # One-time source bootstrap for the browser upload. The archive contains no
      # workflows, credentials, binaries, or dependencies and is removed in the same commit.
      - name: Materialize initial source upload
        id: source
        if: hashFiles('wallet-source.zip') != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Expand-Archive -Path wallet-source.zip -DestinationPath . -Force
          Remove-Item wallet-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Materialize FRAME Wallet source and remove transport archive'
          git push origin HEAD:main
          "initial=true" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify derivation, vault and all three transaction signatures
        run: npm test
      - name: Typecheck and compile
        run: npm run build
      - name: Exercise real Electron runtime and renderer isolation
        run: node scripts/smoke.mjs
      - name: Package Windows x64 NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath release/SHA256SUMS.txt -Append -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FRAME-Wallet-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            docs/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish release with installer
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) || steps.source.outputs.initial == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INITIAL_UPLOAD: ${{ steps.source.outputs.initial }}
        run: |
          if ($env:REF_TYPE -eq 'tag') { $tag = $env:TAG_REF }
          elseif ($env:INITIAL_UPLOAD -eq 'true') { $tag = 'v0.1.0' }
          else { $tag = "v0.1.0-build.${{ github.run_number }}" }
          $sha = git rev-parse HEAD
          $notes = @'
          FRAME Wallet 0.1: Windows x64 experimental desktop wallet.
          Download FRAME-Wallet-0.1.0-Setup-x64.exe and compare SHA256SUMS.txt.
          Includes Pop Control / Alien Signal themes; SOL, ETH and BTC native transfers.
          Defaults to Solana Devnet, Ethereum Sepolia and Bitcoin Testnet3.
          This build has not received an independent security audit. Test networks first.
          Installer is not Authenticode signed. No signing certificate was supplied.
          '@
          $notes | Out-File -FilePath release/notes.md -Encoding utf8
          gh release create $tag --target $sha --title "FRAME Wallet $tag" --notes-file release/notes.md --prerelease release/*.exe release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
